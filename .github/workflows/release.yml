name: Publish BRXT
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python scripts/build_brxt.py
      - run: git diff --exit-code -- extensions/
      - name: Publish stable and versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          cp extensions/ucsfomopagent.brxt "extensions/ucsfomopagent-$version.brxt"
          cd extensions
          shasum -a 256 *.brxt > SHA256SUMS
          gh release create "$RELEASE_TAG" *.brxt SHA256SUMS --title "UCSFOMOPAgent $RELEASE_TAG" --generate-notes
