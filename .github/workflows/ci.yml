name: Extension checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --wheel
      - run: uv run python scripts/build_brxt.py
      - run: git diff --exit-code -- extensions/
