name: Windows private storage
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-private-storage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --locked --python 3.13
      - run: uv run python -m unittest discover -s tests -p test_private_storage_windows.py -v
